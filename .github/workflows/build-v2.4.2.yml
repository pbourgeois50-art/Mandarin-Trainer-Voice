name: Build Voice Trainer v2.4.2
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unpack merged v2.4.2 source
        run: unzip -q voice242-source-small.zip -d appsrc
      - name: Download offline Paraformer model
        run: |
          MODEL=appsrc/app/src/main/assets/sherpa-onnx-streaming-paraformer-bilingual-zh-en
          mkdir -p "$MODEL"
          wget -q --show-progress -O "$MODEL/encoder.int8.onnx" https://huggingface.co/csukuangfj/streaming-paraformer-zh/resolve/main/encoder.int8.onnx
          wget -q --show-progress -O "$MODEL/decoder.int8.onnx" https://huggingface.co/csukuangfj/streaming-paraformer-zh/resolve/main/decoder.int8.onnx
          wget -q -O "$MODEL/tokens.txt" https://huggingface.co/csukuangfj/streaming-paraformer-zh/resolve/main/tokens.txt
          printf '%s\n' '---' 'license: apache-2.0' '---' > "$MODEL/README.md"
      - name: Download Sherpa ONNX Android AAR
        run: |
          mkdir -p appsrc/deps/aar
          wget -q --show-progress -O appsrc/deps/sherpa.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-1.13.2.aar
          unzip -q appsrc/deps/sherpa.aar -d appsrc/deps/aar
      - name: Build APK cleanly
        run: |
          cd appsrc
          export ANDROID_HOME=${ANDROID_HOME}
          export BUILD_TOOLS_VERSION=36.0.0
          export ANDROID_PLATFORM=android-36
          ./build-github.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MandarinTrainer-Voice-v2.4.2
          path: appsrc/output/*
          retention-days: 30
